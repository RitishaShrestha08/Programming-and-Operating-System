name: Run Memory Layout Program

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t memory-layout .

      - name: Run Memory Layout Program
        run: docker run --rm memory-layout
